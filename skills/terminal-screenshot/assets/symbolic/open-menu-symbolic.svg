<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Hamburger menu glyph, modeled on GNOME Adwaita open-menu-symbolic geometry.
       Self-drawn (CC0): three rounded 16px-wide lines at 3px pitch. -->
  <g fill="#ffffff">
    <rect x="1" y="3" width="14" height="2" rx="1"/>
    <rect x="1" y="7" width="14" height="2" rx="1"/>
    <rect x="1" y="11" width="14" height="2" rx="1"/>
  </g>
</svg>
